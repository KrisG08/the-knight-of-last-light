name: Improvement request
description: Propose a focused gameplay, presentation or usability improvement.
title: "[Improvement] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What should improve for the player?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior and acceptance criteria
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References or visual examples
