[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/audio/voice/manifest.json,assets/audio/voice/CREDITS.txt,assets/localization/*.json,game/cloud/cloud_config.json,assets/fonts/*-OFL.txt,assets/vendor/kenney_fps_audio/*.txt,assets/vendor/mythic_fauna/*.txt,assets/models/meshy/*.json,assets/models/meshy/*.txt"
exclude_filter="backend/*,tests/*,tools/*,docs/*,examples/*,planning/*,build/*,MANIFEST.sha256.json,*.md,*.csv,*.zip,*.tpz,*.ps1,*.cmd,assets/cinematics/opening_mobile.ogv,assets/cinematics/menu_wind_mobile.ogv,assets/cinematics/menu_wind_loop.ogv"
export_path="build/windows/LastLight.exe"
script_export_mode=2

[preset.0.options]
custom_template/debug="res://.tools/templates/windows_debug_x86_64.exe"
custom_template/release="res://.tools/templates/windows_release_x86_64.exe"
debug/export_console_wrapper=1
binary_format/embed_pck=false
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
codesign/enable=false
application/modify_resources=true
application/icon="res://assets/ui/last-light-icon.svg"
application/product_name="The Knight of Last Light"
application/file_description="Village slice development build"

