name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source and LFS pointers
        uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - name: Validate repository layout and tracked files
        run: python3 tools/check_repository.py --allow-lfs-pointers
